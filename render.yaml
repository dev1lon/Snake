services:
  - type: web
    name: snake-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://base-snake.app
      - key: BASE_API_KEY
        sync: false
      # Single admin wallet address (case-insensitive). Backend also supports
      # ADMIN_ADDRESSES (comma-separated) if you need multiple admins later.
      - key: ADMIN_WALLET_ADDRESS
        sync: false
      - key: CDP_PAYMASTER_URL
        sync: false

  - type: web
    name: snake-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: snake-backend
          property: host
      - key: VITE_RECORD_CONTRACT_ADDRESS
        value: 0x9e5d82E6B6419C066Bc57F5a70116659c468d780
      - key: VITE_BUILDER_CODE_SUFFIX
        value: 0x62635f38776576327439680b0080218021802180218021802180218021
