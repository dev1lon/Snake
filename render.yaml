services:
  - type: web
    name: snake-backend
    env: node
    rootDir: backend
    plan: free
    # npm ci, not npm install: the lockfile decides what ships, so a build can't
    # silently pick up a new version of a wallet dependency.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://base-snake.app
      - key: BASE_API_KEY
        sync: false
      # Single admin wallet address (case-insensitive). Backend also supports
      # ADMIN_ADDRESSES (comma-separated) if you need multiple admins later.
      - key: ADMIN_WALLET_ADDRESS
        sync: false
      - key: CDP_PAYMASTER_URL
        sync: false
      # SnakeArcade address. Runs and revive purchases are read back from its
      # events; without it the run endpoints answer 503.
      - key: ARCADE_CONTRACT_ADDRESS
        value: 0xd3a355586a035bAA80eA56d6D8627b0F64141D78
      # Dedicated Base RPC. Every login verifies a Smart Wallet signature with
      # an eth_call, and the default public endpoint rate-limits.
      - key: RPC_URL
        sync: false
      # Comma-separated extra origins (preview deploys, second domain). They
      # join the CORS allowlist, the CSRF check and the SIWE domain allowlist.
      - key: ADDITIONAL_ORIGINS
        sync: false
      # Optional: set DATABASE_URL (plus DATABASE_SSL=true) to keep sessions and
      # streaks across restarts. Without it both live in memory and are lost
      # whenever the free instance sleeps or redeploys.

  - type: web
    name: snake-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    # Every path serves index.html so BrowserRouter URLs survive a refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: snake-backend
          property: host
      - key: VITE_RECORD_CONTRACT_ADDRESS
        value: 0x9e5d82E6B6419C066Bc57F5a70116659c468d780
      # SnakeArcade. Saving a run and buying revives both cost money and both
      # go here.
      - key: VITE_ARCADE_CONTRACT_ADDRESS
        value: 0xd3a355586a035bAA80eA56d6D8627b0F64141D78
      - key: VITE_BUILDER_CODE_SUFFIX
        value: 0x62635f38776576327439680b0080218021802180218021802180218021
      # Domain-restricted RPC key. Falls back to the public Base endpoint.
      - key: VITE_RPC_URL
        sync: false
      # Sends non-Base-App browsers to /gate.html. Off unless set to "true";
      # put the mini app link into public/gate.html before turning it on.
      - key: VITE_REQUIRE_BASE_APP
        sync: false
